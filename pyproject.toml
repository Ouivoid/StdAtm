[project]
name = "stdatm"
version = "0.4.3"
description = "Numpy-oriented Standard Atmosphere model"
authors = [{ name = "Christophe DAVID", email = "christophe.david@onera.fr" }]
requires-python = ">=3.8,<4"
readme = "README.md"
license = "GPL-3.0-only"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22.0, <1.25 ; python_full_version >= '3.8' and python_full_version < '3.9'",
    "numpy>=1.23.2, <3 ; python_full_version >= '3.9' and python_full_version < '3.12'",
    "numpy>=1.26, <3 ; python_full_version >= '3.12' and python_full_version < '4'",
    "scipy>=1.9.3, <1.11 ; python_full_version >= '3.8' and python_full_version < '3.9'",
    "scipy>=1.10,<2 ; python_full_version >= '3.9' and python_full_version < '3.12'",
    "scipy>=1.11.2,<2 ; python_full_version >= '3.12' and python_full_version < '4'",
]

[project.urls]
Homepage = "https://github.com/fast-aircraft-design/StdAtm"

[dependency-groups]
test = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "coverage[toml]>=7.0,<8",
]
benchmark = [
    "pytest-profiling>=1.7.0,<2",
    "snakeviz>=2.1.1,<3",
    "pytest-benchmark[histogram]>=4,<5",
]
doc = [
    "sphinx>=4.1.2,<5",
    "sphinx-rtd-theme>=1.0,<2",
    "sphinxcontrib-bibtex>=2.3.0,<3",
]
lint = [
    "pre-commit>=2.14.1,<3",
    "ruff==0.4.9",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/stdatm"]
exclude = ["**/tests/**"]

[tool.hatch.build.targets.wheel]
include = ["src/stdatm"]
exclude = ["**/tests/**"]

[tool.hatch.build.targets.wheel.sources]
"src/stdatm" = "stdatm"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov-report term-missing --cov-report html --verbose --benchmark-disable --benchmark-autosave  --benchmark-calibration-precision=100 --benchmark-max-time=2.0"
testpaths = ["src"]
norecursedirs = ["dist", "build", ".tox"]

[tool.coverage.run]
branch = true
source = ["stdatm"]
omit = ["*/test/*", "*/tests/*"]
[tool.coverage.paths]
source = ["src/", "*/site-packages/"]
[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ = = .__main__.:"
]
